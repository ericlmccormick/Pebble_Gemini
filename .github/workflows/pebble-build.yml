name: Pebble native six-platform build

on:
  push:
    branches: [main, gemini-reliability-review-2026-11-03, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pebble SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs npm libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0
      - name: Install Pebble CLI and current SDK
        run: |
          python -m pip install uv
          uv tool install pebble-tool --python python3.12
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/pebble" sdk install latest
      - name: Build all target platforms
        run: |
          pebble build
      - name: Check package contains six platform builds
        run: |
          python - <<'PY'
          import glob, json, zipfile
          with open('package.json') as f:
              manifest=json.load(f)
          expected={'basalt','chalk','diorite','flint','emery','gabbro'}
          assert set(manifest['pebble']['targetPlatforms']) == expected
          pbws=glob.glob('build/*.pbw')
          assert pbws, 'No Pebble app package was created'
          with zipfile.ZipFile(pbws[0]) as z:
              names=z.namelist()
              for platform in sorted(expected):
                  assert any(platform in n for n in names), f'Missing {platform} binary in {pbws[0]}: {names}'
          print('Built and packaged all six targets:', ', '.join(sorted(expected)))
          PY
